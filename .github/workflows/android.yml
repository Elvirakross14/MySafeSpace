name: Build My Safe Space APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5

      - name: Unpack project
        run: unzip -q MySafeSpace_GitHub_Build.zip -d source

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/MySafeSpace
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MySafeSpace-APK
          path: source/MySafeSpace/app/build/outputs/apk/debug/app-debug.apk
