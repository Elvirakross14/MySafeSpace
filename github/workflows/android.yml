name: Build My Safe Space APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -q MySafeSpace_GitHub_Build.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/MySafeSpace
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MySafeSpace-APK
          path: source/MySafeSpace/app/build/outputs/apk/debug/app-debug.apk
